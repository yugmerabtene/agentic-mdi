# Configuration PHP du laboratoire de gestion des utilisateurs.
# Les erreurs ne sont jamais renvoyées au navigateur : elles sont seulement
# journalisées, comme l'exige le cahier des charges.

; Affichage des erreurs coupé : un message d'exception ne doit jamais atteindre
; le navigateur, car il révèle des détails internes de l'application.
display_errors = Off
display_startup_errors = Off

; Journalisation complète côté serveur, où le fichier de sortie d'erreur
; d'Apache est déjà collecté par Docker.
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Les valeurs de configuration applicative arrivent par l'environnement du
; conteneur, jamais par une valeur codée en dur dans un fichier PHP. La lettre E
; est placée en tête de l'ordre des variables pour que l'environnement soit
; également lisible par le tableau global $_ENV, et pas seulement par la
; fonction getenv.
variables_order = "EGPCS"

; Limites de la requête, cohérentes avec la taille des colonnes du schéma.
upload_max_filesize = 2M
post_max_size = 2M
memory_limit = 128M
