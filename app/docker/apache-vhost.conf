# Hôte Apache du laboratoire de gestion des utilisateurs.
# La racine web est restreinte au répertoire public : le code applicatif, le
# schéma et la configuration restent hors de ce qui est servi.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Aucune liste de fichiers, et les liens symboliques sont suivis pour
        # que les ressources de css et de javascript soient servies.
        Options -Indexes +FollowSymLinks
        # Les règles de réécriture et de sécurité du développeur sont appliquées
        # depuis un .htaccess placé dans le répertoire public.
        AllowOverride All
        Require all granted
    </Directory>

    # Défense en profondeur : même si la racine web changeait un jour, ces
    # répertoires resteraient hors service. Une requête vers
    # /src/config/database.php renvoie 404, jamais le fichier.
    <DirectoryMatch "^/var/www/html/(src|sql|docker)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Pas de page d'accueil déduite : la racine renvoie la page d'accueil du
    # développeur, ou une erreur 404 explicite si elle n'existe pas encore.
    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
